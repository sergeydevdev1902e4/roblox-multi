[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-multi"
version = "0.2.1"
description = "CLI tool to manage multiple Roblox profiles and run parallel instances"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "mitch" }
]
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "cryptography>=39.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
roblox-multi = "roblox_multi.cli:main"
rbxmulti = "roblox_multi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
