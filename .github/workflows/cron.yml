name: cron

on:
  schedule:
    - cron: "25 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- last-sync: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- last-sync: " "$f"; then
            sed -i "s|^<!-- last-sync: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "sergeydevdev1902e4"
          git config user.email "279190752+sergeydevdev1902e4@users.noreply.github.com"
          set -- "docs: bump date" "docs: touch up" "docs: refresh timestamp" "chore: scheduled refresh" "chore: nightly tidy"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
